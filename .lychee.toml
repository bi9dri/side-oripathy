include_verbatim = true

# Resolve root-relative links (/docs/..., /converter, /img/...) against the deployed site.
# Internal link integrity is also verified by onBrokenLinks: "throw" at build time.
base_url = "https://side-oripathy.bidri.dev"

# Skip anchor-only and mailto links
exclude = [
  "^#",
  "^mailto:",
  "https://www\\.youtube\\.com"
]

# Accept 429 (rate-limited = link is live)
accept = [200, 204, 206, 301, 302, 429]

timeout = 20
