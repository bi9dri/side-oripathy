name: Check bun version consistency

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - devbox.json
      - package.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: bash scripts/check-bun-version.sh
