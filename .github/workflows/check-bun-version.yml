name: Check bun version consistency

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - devbox.json
      - package.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-bun-version.sh
