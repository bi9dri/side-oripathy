name: Visual Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    # 意図した差分を `vrt:accepted` ラベルで承認できるようにするため labeled も拾う。
    types: [opened, synchronize, reopened, labeled]

# baseline の自動コミットが競合しないよう main の run は直列化する。PR は最新の push
# だけ検証すればよいので古い run を打ち切るが、labeled は打ち切らない (先行 run の
# check 結果が消え、生き残った run が check を skip するのを避ける)。
concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

permissions:
  contents: read

jobs:
  # VRT (baseline 比較) + a11y。Playwright がブラウザを起動するため Chromium を install する。
  e2e:
    name: VRT + a11y
    runs-on: ubuntu-latest
    # `gh pr edit` で承認ラベルを消費する。fork PR では token が read-only に降格される
    # ため、承認フローは同一リポジトリのブランチにだけ適用する。
    permissions:
      contents: read
      pull-requests: write
    # ハングで長時間放置されるのを防ぐ安全網。
    timeout-minutes: 20
    steps:
      # 意図した差分を承認する手段。`vrt:accepted` ラベルが付いた PR では比較を
      # スキップしてジョブを成功させる。検出と同時にラベルを消費するので、途中で
      # キャンセルされても承認が次のコミットに残らない。重い step より前に置くことで、
      # 承認済み run では install / build を走らせない。
      - id: acceptance
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'vrt:accepted'; then
            gh pr edit "$PR_NUMBER" --remove-label vrt:accepted
            echo "accepted=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.acceptance.outputs.accepted != 'true'
        with:
          # PR コードから GITHUB_TOKEN を読めないようにする (ラベル操作は上で env 渡し)。
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.acceptance.outputs.accepted != 'true'

      - name: Install dependencies
        if: steps.acceptance.outputs.accepted != 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.acceptance.outputs.accepted != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Build website
        if: steps.acceptance.outputs.accepted != 'true'
        run: bun run build

      - name: Compare against baselines
        if: github.event_name == 'pull_request' && steps.acceptance.outputs.accepted != 'true'
        run: bun run test/visual/e2e

      # main では差分を承認済みとして baseline を再生成する。生成物は vrt-baselines job がコミットする。
      - name: Refresh baselines
        if: github.event_name == 'push'
        run: bun run test/visual/e2e:update

      - name: Upload VRT diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-diff
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload refreshed baselines
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-baselines
          path: tests/visual
          retention-days: 1
          if-no-files-found: error

  # main への push 時だけ、Linux で再生成した baseline を main にコミットする。
  # push は ruleset の bypass に登録した deploy key で行い、GITHUB_TOKEN は read のまま。
  vrt-baselines:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # ruleset の bypass (Always allow) に登録した deploy key。この job にだけ渡す。
          ssh-key: ${{ secrets.VRT_BASELINE_DEPLOY_KEY }}
      # 削除された route の baseline を残さないよう、既存の snapshot を一度消してから
      # artifact を展開する (artifact は差分ではなく全体を持つ)。
      - name: Remove stale snapshots
        run: find tests/visual -type d -name '*-snapshots' -prune -exec rm -rf {} +
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vrt-baselines
          path: tests/visual
      # artifact が空、あるいは想定と違う階層に展開されたまま全 baseline を消して
      # コミットしないためのガード。
      - name: Verify baselines
        run: |
          if ! ls tests/visual/*-snapshots/*.png >/dev/null 2>&1; then
            echo "Baselines are not laid out under tests/visual/<name>-snapshots/" >&2
            exit 1
          fi
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # artifact には tests/visual 配下のテストコードも含まれる。main が artifact
          # 生成後に進んでいてもソースを巻き戻さないよう、snapshot だけをステージする
          # (削除された baseline も `-A` + pathspec で拾える)。
          git add -A -- ':(glob)tests/visual/**/*-snapshots/**'
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          # [skip ci] でこの push による CI の再帰実行を止める。
          git commit -m "chore(vrt): スクリーンショット baseline を更新 [skip ci]"
          # deploy key で push するため remote を SSH に切り替える。
          git remote set-url origin "git@github.com:${{ github.repository }}.git"
          git push origin HEAD:main

  # Lighthouse perf budget。e2e と独立に並列実行する。
  # lhci は runner 同梱の system Chrome を使うため Chromium install は不要。
  perf:
    name: Lighthouse CI (perf budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Run Lighthouse CI (perf budgets)
        run: bun run test/visual/perf
