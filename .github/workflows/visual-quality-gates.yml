name: Visual Quality Gates

on:
  push:
    branches:
      - main
  pull_request:

# 同一 ref の古い実行はキャンセルして Argos snapshot / runner 時間を節約する。
concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    name: VRT (Argos) + a11y + Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Argos の base build / parent commit 検出を安定させるため全履歴を取得する。
          fetch-depth: 0
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # lhci は chromium.executablePath() を参照するため VRT と共通で Chromium を入れる。
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build website
        run: bun run build

      # argosScreenshot が ./screenshots に画像を書き出す (reporter 未設定のため自動 upload はしない)。
      - name: Run VRT + a11y (Playwright)
        run: bun run test/visual/e2e
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

      # a11y などで Playwright が落ちても screenshot を Argos に送り VRT 差分を可視化する。
      # argos upload は差分があっても exit 0。合否判定は Argos の GitHub チェックが担う。
      - name: Upload screenshots to Argos
        if: ${{ !cancelled() }}
        run: bunx argos upload ./screenshots
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

      # perf budget (lhci) は e2e の成否に依らず実行してフルシグナルを得る。
      - name: Run Lighthouse CI (perf budgets)
        if: ${{ !cancelled() }}
        run: bun run test/visual/perf
